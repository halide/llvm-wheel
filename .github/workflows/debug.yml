name: Debug Windows platform tags

on:
  workflow_dispatch:

jobs:
  debug-win-tags:
    name: Debug / ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86-64-windows
            msvc_arch: amd64
          - platform: x86-32-windows
            msvc_arch: amd64_x86

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Dump environment
        shell: bash
        run: |
          echo "=== VSCMD vars ==="
          env | grep -i VSCMD || echo "(none found)"
          echo ""
          echo "=== Platform detection ==="
          python debug/check_platform.py

      - name: Build wheel (dry run)
        run: |
          pip install scikit-build-core
          pip wheel . -w dist/ -v --no-build-isolation --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=toolchains/${{ matrix.toolchain || 'x86-64-windows.cmake' }}
        continue-on-error: true

      - name: Inspect wheel filenames
        shell: bash
        run: ls -la dist/*.whl 2>/dev/null || echo "No wheels produced"
